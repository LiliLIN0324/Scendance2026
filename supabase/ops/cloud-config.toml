# Targeted cloud settings. Apply from a temporary Supabase workdir; undeclared
# settings remain unchanged. Local development uses supabase/config.toml.
project_id = "scendance-scene-planner"

[api]
schemas = ["public", "graphql_public"]

[auth]
site_url = "https://scendance.charlestech.org"
additional_redirect_urls = ["https://scendance.charlestech.org", "https://scendance.charlestech.org/auth/callback", "http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# Email confirmation requires a dedicated SMTP service for public signups.
enable_signup = true
enable_confirmations = true
