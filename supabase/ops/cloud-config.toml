# Targeted cloud settings. Apply from a temporary Supabase workdir; undeclared
# settings remain unchanged. Local development uses supabase/config.toml.
project_id = "scendance-scene-planner"

[api]
schemas = ["public", "graphql_public"]

[auth]
site_url = "https://scendance-scene-planner-ewz.pages.dev"
additional_redirect_urls = ["https://scendance-scene-planner-ewz.pages.dev", "https://scendance-scene-planner-ewz.pages.dev/auth/callback", "https://scendance.charlestech.org", "https://scendance.charlestech.org/auth/callback", "http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
enable_signup = true
# The web client opens a guest session for visitors who have not signed in.
enable_anonymous_sign_ins = true
minimum_password_length = 12

[auth.email]
# Email confirmation requires a dedicated SMTP service for public signups.
enable_signup = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[auth.rate_limit]
email_sent = 30
