<!doctype html>
<html lang="zh-CN"><body style="margin:0;background:#f3f2ed;font-family:Arial,'PingFang SC',sans-serif;color:#242620">
  <main style="max-width:520px;margin:32px auto;padding:32px;background:#fff;border-radius:16px">
    <p style="color:#526b3d">幕景 Scendance</p>
    <h1 style="font-size:24px">确认你的邮箱</h1>
    <p>请在注册页面输入下面的六位验证码，完成注册并创建你的个人工作室。</p>
    <p style="font-size:32px;letter-spacing:8px;font-weight:bold">{{ .Token }}</p>
    <p>验证码有效期为 10 分钟，只能使用一次。请勿向他人透露。</p>
    <p><a href="{{ .SiteURL }}/auth">返回登录与注册页面</a></p>
    <p style="color:#767d6f;font-size:13px">如果你没有申请注册，请忽略这封邮件。</p>
  </main>
</body></html>
