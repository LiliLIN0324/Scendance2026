<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256" role="img" aria-label="幕景 Scendance · AI 的门">
<style>
.form{transform-box:fill-box;transform-origin:center;opacity:0}
.f-door{animation:f-door 4.8s linear infinite}
.f-ball{animation:f-ball 4.8s linear infinite}
.f-pyr{animation:f-pyr 4.8s linear infinite}
.f-cube{animation:f-cube 4.8s linear infinite}
@keyframes f-door{0%{opacity:0}4%{opacity:1}23%{opacity:1}27%{opacity:0}100%{opacity:0}}
@keyframes f-ball{0%{opacity:0}23%{opacity:0}27%{opacity:1}48%{opacity:1}52%{opacity:0}100%{opacity:0}}
@keyframes f-pyr{0%{opacity:0}48%{opacity:0}52%{opacity:1}73%{opacity:1}77%{opacity:0}100%{opacity:0}}
@keyframes f-cube{0%{opacity:0}73%{opacity:0}77%{opacity:1}96%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){
  .f-ball,.f-pyr,.f-cube{opacity:0!important}
  .f-door{opacity:1!important;animation:none!important}
}

@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} .frame{transform:none!important;opacity:1!important;filter:none!important} .eye{transform:none!important}}</style>
