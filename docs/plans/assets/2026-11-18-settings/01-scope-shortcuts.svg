<svg width="1600" height="1040" viewBox="0 0 1600 1040" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Scendance 设置信息架构与快捷键草图</title>
  <desc id="desc">两张并排的低保真草图：左侧设置外壳按个人与本方案分组，右侧快捷键页带搜索、平台切换和模式筛选。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1F2933" flood-opacity="0.10"/>
    </filter>
    <style>
      .ink { fill: #1F2933; }
      .muted { fill: #6B7280; }
      .faint { fill: #9CA3AF; }
      .teal { fill: #0F766E; }
      .orange { fill: #C2410C; }
      .label { font: 600 13px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; letter-spacing: .04em; }
      .h1 { font: 700 34px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
      .h2 { font: 700 20px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
      .h3 { font: 700 17px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
      .body { font: 400 13px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
      .small { font: 400 12px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
      .tiny { font: 400 11px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
      .strong { font: 600 13px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
      .kbd { font: 600 12px "Cascadia Mono", "SFMono-Regular", Consolas, monospace; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#F7F5EF"/>
  <text x="1522" y="48" class="tiny muted" text-anchor="end">讨论稿 · 2026-11-18</text>

  <text x="48" y="60" class="h1 ink">Scendance 设置 · 信息架构草图</text>
  <text x="48" y="92" class="body muted">PR1 只改「说人话」；这张图把 PR2 后的个人偏好与快捷键页一起画出来，用来讨论下一步，而不是跳过 PR1。</text>

  <g transform="translate(1180 26)">
    <rect x="0" y="0" width="372" height="58" rx="10" fill="#FFFDF8" stroke="#D8D4CA"/>
    <rect x="14" y="14" width="12" height="12" rx="3" fill="#0F766E"/>
    <text x="34" y="25" class="tiny muted">已实现 / PR1</text>
    <rect x="126" y="14" width="12" height="12" rx="3" fill="#FFFDF8" stroke="#9CA3AF" stroke-dasharray="3 2"/>
    <text x="146" y="25" class="tiny muted">PR3 后出现</text>
    <rect x="266" y="14" width="12" height="12" rx="3" fill="#FFF3E8" stroke="#F0C7A6"/>
    <text x="286" y="25" class="tiny muted">待拍板</text>
  </g>

  <!-- Frame A -->
  <rect x="48" y="150" width="720" height="820" rx="18" fill="#FFFDF8" stroke="#D8D4CA"/>
  <text x="48" y="184" class="label teal">A · 设置外壳</text>
  <text x="48" y="210" class="h2 ink">先分作用域，再分页面</text>
  <text x="48" y="234" class="small muted">平铺「个人偏好 / 快捷键」能解决 PR1；再多两项就会重新混层。</text>

  <g filter="url(#shadow)">
    <rect x="72" y="258" width="672" height="680" rx="14" fill="#FFFFFF" stroke="#E5E1D8"/>
  </g>
  <rect x="72" y="258" width="672" height="58" rx="14" fill="#FFFFFF"/>
  <rect x="72" y="304" width="672" height="12" fill="#FFFFFF"/>
  <line x1="72" y1="316" x2="744" y2="316" stroke="#ECE8DF"/>
  <text x="94" y="293" class="h3 ink">设置</text>
  <rect x="634" y="276" width="88" height="24" rx="12" fill="#E6F4F1" stroke="#9CCFC5"/>
  <circle cx="650" cy="288" r="3" fill="#0F766E"/>
  <text x="660" y="292" class="tiny teal">已同步</text>

  <rect x="72" y="316" width="190" height="622" fill="#F3F4F1"/>
  <line x1="262" y1="316" x2="262" y2="938" stroke="#ECE8DF"/>

  <text x="94" y="348" class="tiny faint">个人</text>
  <rect x="84" y="360" width="166" height="38" rx="8" fill="#0F766E"/>
  <text x="102" y="384" class="strong" fill="#FFFFFF">个人偏好</text>
  <text x="102" y="424" class="body ink">快捷键</text>
  <rect x="84" y="444" width="166" height="28" rx="6" fill="#E6F4F1" opacity="0"/>
  <circle cx="230" cy="418" r="3" fill="#0F766E"/>

  <text x="94" y="480" class="tiny faint">本方案</text>
  <line x1="84" y1="492" x2="250" y2="492" stroke="#D8D4CA" stroke-dasharray="3 3"/>
  <text x="94" y="518" class="body faint">显示与网格</text>
  <text x="94" y="554" class="body faint">时区</text>
  <rect x="206" y="502" width="36" height="18" rx="9" fill="#FFFDF8" stroke="#D8D4CA"/>
  <text x="224" y="515" class="tiny faint" text-anchor="middle">PR3</text>

  <text x="94" y="900" class="small muted">团队与权限 ↗</text>
  <text x="94" y="920" class="tiny faint">保留原分区，不搬进设置</text>

  <rect x="282" y="334" width="440" height="50" rx="10" fill="#E6F4F1" stroke="#9CCFC5"/>
  <text x="298" y="356" class="strong teal">个人 · 跟账号走</text>
  <text x="298" y="374" class="tiny" fill="#3F6F68">换方案仍在；未登录或离线时按账号留在本机。</text>
  <text x="704" y="364" class="tiny teal" text-anchor="end">本机 + 云端</text>

  <text x="282" y="418" class="h3 ink">个人偏好</text>
  <text x="282" y="440" class="small muted">只放跟账号走的偏好；本方案另起一组。</text>

  <rect x="282" y="456" width="440" height="72" rx="10" fill="#FFFFFF" stroke="#ECE8DF"/>
  <text x="300" y="482" class="strong ink">显示单位</text>
  <text x="300" y="502" class="tiny muted">标注、属性面板与导出清单的读数跟随</text>
  <rect x="558" y="470" width="146" height="32" rx="8" fill="#F3F4F1"/>
  <rect x="560" y="472" width="70" height="28" rx="6" fill="#FFFFFF" stroke="#D8D4CA"/>
  <text x="595" y="491" class="tiny ink" text-anchor="middle">米 · m</text>
  <text x="666" y="491" class="tiny muted" text-anchor="middle">英尺 · ft</text>
  <text x="704" y="518" class="tiny teal" text-anchor="end">来自个人</text>

  <rect x="282" y="538" width="440" height="66" rx="10" fill="#FFFFFF" stroke="#ECE8DF"/>
  <text x="300" y="564" class="strong ink">尺寸标注</text>
  <text x="300" y="584" class="tiny muted">在画布上显示场地与物件的尺寸读数</text>
  <rect x="674" y="556" width="38" height="22" rx="11" fill="#0F766E"/>
  <circle cx="701" cy="567" r="8" fill="#FFFFFF"/>
  <text x="704" y="596" class="tiny teal" text-anchor="end">来自个人</text>

  <rect x="282" y="614" width="440" height="66" rx="10" fill="#FFFFFF" stroke="#ECE8DF"/>
  <text x="300" y="640" class="strong ink">长度小数位</text>
  <text x="300" y="660" class="tiny muted">自动 = 米 2 位 / 英尺 1 位；也可固定 0 / 1 / 2 位</text>
  <rect x="628" y="628" width="76" height="30" rx="7" fill="#F3F4F1" stroke="#D8D4CA"/>
  <text x="642" y="648" class="tiny ink">自动</text>
  <path d="M686 640 l4 4 4-4" fill="none" stroke="#6B7280" stroke-width="1.5"/>
  <text x="704" y="674" class="tiny teal" text-anchor="end">来自个人</text>

  <rect x="282" y="690" width="440" height="96" rx="10" fill="#FFFDF8" stroke="#E5E1D8"/>
  <text x="300" y="716" class="strong ink">建造画布吸附</text>
  <text x="300" y="736" class="tiny muted">G 只切网格；墙 / 物件吸附是独立开关</text>
  <text x="300" y="764" class="tiny muted">网格</text>
  <rect x="342" y="754" width="30" height="18" rx="9" fill="#0F766E"/>
  <circle cx="363" cy="763" r="6" fill="#FFFFFF"/>
  <text x="390" y="764" class="tiny muted">墙面</text>
  <rect x="432" y="754" width="30" height="18" rx="9" fill="#D8D4CA"/>
  <circle cx="441" cy="763" r="6" fill="#FFFFFF"/>
  <text x="480" y="764" class="tiny muted">物件</text>
  <rect x="522" y="754" width="30" height="18" rx="9" fill="#D8D4CA"/>
  <circle cx="531" cy="763" r="6" fill="#FFFFFF"/>
  <text x="704" y="764" class="tiny orange" text-anchor="end">PR2 接线</text>

  <rect x="282" y="804" width="440" height="58" rx="10" fill="#FFF3E8" stroke="#F0C7A6"/>
  <text x="298" y="826" class="small" fill="#8A3D12">作用域条先回答“跟谁走”；行内来源再回答“这项从哪来”。</text>
  <text x="298" y="846" class="tiny" fill="#8A3D12">来源徽标不做成 tooltip，默认就要看得见。</text>

  <text x="282" y="892" class="tiny muted">PR2 才加吸附与精度；PR3 才出现“本方案”组，不展示空页签。</text>

  <!-- Frame B -->
  <rect x="800" y="150" width="752" height="820" rx="18" fill="#FFFDF8" stroke="#D8D4CA"/>
  <text x="800" y="184" class="label teal">B · 快捷键</text>
  <text x="800" y="210" class="h2 ink">先找得到，再谈改键</text>
  <text x="800" y="234" class="small muted">只读目录也能做得像工具：搜索、平台、模式筛选、条件行内化。</text>

  <g filter="url(#shadow)">
    <rect x="824" y="258" width="704" height="680" rx="14" fill="#FFFFFF" stroke="#E5E1D8"/>
  </g>
  <text x="846" y="294" class="h3 ink">快捷键</text>
  <rect x="1380" y="274" width="122" height="24" rx="12" fill="#F3F4F1" stroke="#D8D4CA"/>
  <text x="1441" y="290" class="tiny muted" text-anchor="middle">只读 · 当前绑定</text>

  <rect x="846" y="314" width="656" height="44" rx="9" fill="#F8F9F7" stroke="#D8D4CA"/>
  <circle cx="866" cy="331" r="6" fill="none" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="871" y1="336" x2="877" y2="342" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round"/>
  <text x="888" y="341" class="small muted">搜索操作或按键，例如：吸附 / G</text>
  <rect x="1372" y="322" width="116" height="28" rx="6" fill="#FFF3E8" stroke="#F0C7A6"/>
  <text x="1430" y="340" class="tiny orange" text-anchor="middle">搜索优先</text>

  <text x="846" y="388" class="tiny muted">平台</text>
  <rect x="892" y="370" width="196" height="32" rx="8" fill="#F3F4F1"/>
  <rect x="894" y="372" width="96" height="28" rx="6" fill="#FFFFFF" stroke="#D8D4CA"/>
  <text x="942" y="391" class="tiny ink" text-anchor="middle">Windows / Linux</text>
  <text x="1046" y="391" class="tiny muted" text-anchor="middle">macOS</text>
  <text x="1502" y="391" class="tiny faint" text-anchor="end">两列都保留，不因平台切换丢信息</text>

  <g transform="translate(846 420)">
    <rect x="0" y="0" width="54" height="28" rx="14" fill="#0F766E"/>
    <text x="27" y="19" class="tiny" fill="#FFFFFF" text-anchor="middle">全部</text>
    <rect x="62" y="0" width="54" height="28" rx="14" fill="#F3F4F1" stroke="#E5E1D8"/>
    <text x="89" y="19" class="tiny muted" text-anchor="middle">建造</text>
    <rect x="124" y="0" width="54" height="28" rx="14" fill="#F3F4F1" stroke="#E5E1D8"/>
    <text x="151" y="19" class="tiny muted" text-anchor="middle">变换</text>
    <rect x="186" y="0" width="54" height="28" rx="14" fill="#F3F4F1" stroke="#E5E1D8"/>
    <text x="213" y="19" class="tiny muted" text-anchor="middle">视图</text>
    <rect x="248" y="0" width="54" height="28" rx="14" fill="#F3F4F1" stroke="#E5E1D8"/>
    <text x="275" y="19" class="tiny muted" text-anchor="middle">户外</text>
    <rect x="310" y="0" width="54" height="28" rx="14" fill="#F3F4F1" stroke="#E5E1D8"/>
    <text x="337" y="19" class="tiny muted" text-anchor="middle">标注</text>
    <rect x="372" y="0" width="54" height="28" rx="14" fill="#F3F4F1" stroke="#E5E1D8"/>
    <text x="399" y="19" class="tiny muted" text-anchor="middle">例外</text>
  </g>

  <text x="846" y="478" class="tiny faint">操作</text>
  <text x="1080" y="478" class="tiny faint">Windows</text>
  <text x="1232" y="478" class="tiny faint">macOS</text>
  <text x="1350" y="478" class="tiny faint">条件 / 备注</text>
  <line x1="846" y1="488" x2="1502" y2="488" stroke="#ECE8DF"/>

  <text x="846" y="514" class="tiny teal">建造画布 · 编辑</text>
  <line x1="936" y1="509" x2="1502" y2="509" stroke="#E6F4F1"/>

  <text x="846" y="542" class="small ink">撤销</text>
  <rect x="1076" y="526" width="58" height="22" rx="5" fill="#F8F9F7" stroke="#D8D4CA"/>
  <text x="1105" y="541" class="kbd ink" text-anchor="middle">Ctrl+Z</text>
  <rect x="1230" y="526" width="44" height="22" rx="5" fill="#F8F9F7" stroke="#D8D4CA"/>
  <text x="1252" y="541" class="kbd ink" text-anchor="middle">⌘Z</text>
  <text x="1350" y="541" class="tiny muted">输入框内不拦截</text>

  <text x="846" y="582" class="small ink">重做</text>
  <rect x="1076" y="566" width="128" height="22" rx="5" fill="#F8F9F7" stroke="#D8D4CA"/>
  <text x="1140" y="581" class="kbd ink" text-anchor="middle">Ctrl+Shift+Z / Y</text>
  <rect x="1230" y="566" width="66" height="22" rx="5" fill="#F8F9F7" stroke="#D8D4CA"/>
  <text x="1263" y="581" class="kbd ink" text-anchor="middle">⌘⇧Z / Y</text>
  <text x="1350" y="581" class="tiny muted">输入框内不拦截</text>

  <text x="846" y="622" class="small ink">删除</text>
  <rect x="1076" y="606" width="120" height="22" rx="5" fill="#F8F9F7" stroke="#D8D4CA"/>
  <text x="1136" y="621" class="kbd ink" text-anchor="middle">Delete / Backspace</text>
  <rect x="1230" y="606" width="88" height="22" rx="5" fill="#F8F9F7" stroke="#D8D4CA"/>
  <text x="1274" y="621" class="kbd ink" text-anchor="middle">Delete / ⌫</text>
  <text x="1350" y="621" class="tiny muted">有选中</text>

  <text x="846" y="668" class="tiny teal">建造画布 · 视图</text>
  <line x1="936" y1="663" x2="1502" y2="663" stroke="#E6F4F1"/>

  <rect x="838" y="684" width="664" height="36" rx="7" fill="#E6F4F1"/>
  <text x="846" y="707" class="small ink">网格吸附</text>
  <rect x="1076" y="692" width="34" height="22" rx="5" fill="#FFFFFF" stroke="#9CCFC5"/>
  <text x="1093" y="707" class="kbd ink" text-anchor="middle">G</text>
  <rect x="1230" y="692" width="34" height="22" rx="5" fill="#FFFFFF" stroke="#9CCFC5"/>
  <text x="1247" y="707" class="kbd ink" text-anchor="middle">G</text>
  <text x="1350" y="707" class="tiny teal">仅网格；墙 / 物件独立</text>

  <text x="846" y="754" class="small ink">尺寸标注</text>
  <rect x="1076" y="738" width="34" height="22" rx="5" fill="#F8F9F7" stroke="#D8D4CA"/>
  <text x="1093" y="753" class="kbd ink" text-anchor="middle">M</text>
  <rect x="1230" y="738" width="34" height="22" rx="5" fill="#F8F9F7" stroke="#D8D4CA"/>
  <text x="1247" y="753" class="kbd ink" text-anchor="middle">M</text>
  <text x="1350" y="753" class="tiny faint">—</text>

  <text x="846" y="794" class="small ink">楼层</text>
  <rect x="1076" y="778" width="118" height="22" rx="5" fill="#F8F9F7" stroke="#D8D4CA"/>
  <text x="1135" y="793" class="kbd ink" text-anchor="middle">PageUp / PageDown</text>
  <rect x="1230" y="778" width="118" height="22" rx="5" fill="#F8F9F7" stroke="#D8D4CA"/>
  <text x="1289" y="793" class="kbd ink" text-anchor="middle">PageUp / PageDown</text>
  <text x="1362" y="793" class="tiny faint">—</text>

  <rect x="846" y="822" width="656" height="64" rx="10" fill="#FDF6E3" stroke="#E8D6A6"/>
  <text x="862" y="844" class="small" fill="#7A5A13">同名键不是冲突，是模式。</text>
  <text x="862" y="864" class="tiny" fill="#7A5A13">R：建造 = 旋转 90° / 标注 = 矩形 / 户外设施落位 = 旋转；条件写在行内。</text>

  <text x="846" y="912" class="tiny muted">搜索匹配操作、键名和备注；无结果时给“清除筛选”，不假装没有快捷键。</text>

  <rect x="48" y="992" width="1504" height="34" rx="8" fill="#1F2933"/>
  <text x="66" y="1014" class="small" fill="#FFFFFF">结论：设置页第一层是作用域，快捷键页第一层是模式；两者都不先做“改键”。</text>
  <text x="1534" y="1014" class="tiny" fill="#C7D2D0" text-anchor="end">草图不是最终视觉；先拍板结构，再谈样式。</text>
</svg>
