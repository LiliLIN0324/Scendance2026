  <g>
    <text x="72" y="876" class="small ink">无选中</text>
    <text x="300" y="876" class="kbd muted">R</text>
    <rect x="520" y="860" width="56" height="22" rx="11" fill="#FBEAEA" stroke="#E4B4B0"/><text x="548" y="875" text-anchor="middle" class="tiny red">拦截</text>
    <text x="700" y="876" class="small muted">先选中一个物件或墙，再用这个键。</text>
  </g>
