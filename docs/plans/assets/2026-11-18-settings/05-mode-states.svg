  <!-- Matrix -->
  <rect x="48" y="630" width="1504" height="292" rx="16" fill="#FFFDF8" stroke="#D8D4CA"/>
  <text x="72" y="660" class="label orange">C · 状态 × 键 → 结果 → 提示</text>
  <text x="72" y="684" class="h2 ink">拦截不是「没反应」，是「告诉你为什么」</text>
  <text x="1512" y="662" class="tiny faint" text-anchor="end">同一原因 1.6s 内只提示一次</text>

  <line x1="72" y1="702" x2="1528" y2="702" stroke="#D8D4CA"/>
  <text x="72" y="724" class="tiny faint">状态</text>
  <text x="300" y="724" class="tiny faint">按键</text>
  <text x="520" y="724" class="tiny faint">结果</text>
  <text x="700" y="724" class="tiny faint">反馈文案</text>

