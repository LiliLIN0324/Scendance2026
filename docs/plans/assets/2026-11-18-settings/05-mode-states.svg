    <text x="300" y="796" class="kbd muted">Delete</text>
    <rect x="520" y="780" width="56" height="22" rx="11" fill="#FBEAEA" stroke="#E4B4B0"/><text x="548" y="795" text-anchor="middle" class="tiny red">拦截</text>
    <text x="700" y="796" class="small muted">裸键归相机；按 Esc 退出漫游后再编辑。</text>
  </g>
