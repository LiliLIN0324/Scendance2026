  <text x="1308" y="490" class="tiny faint">入口：键盘 ? · 评审</text>
  <line x1="1308" y1="508" x2="1532" y2="508" stroke="#F1EDE5"/>
  <text x="1308" y="528" class="code">workbenchMode !== layout</text>
