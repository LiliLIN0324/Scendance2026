    <rect x="520" y="820" width="56" height="22" rx="11" fill="#FFF3E8" stroke="#F0C7A6"/><text x="548" y="835" text-anchor="middle" class="tiny orange">暂扣</text>
    <text x="700" y="836" class="small muted">松手后再撤销；拖动位置不会丢。</text>
