    <text x="300" y="756" class="kbd muted">Delete</text>
    <rect x="520" y="740" width="56" height="22" rx="11" fill="#FBEAEA" stroke="#E4B4B0"/><text x="548" y="755" text-anchor="middle" class="tiny red">拦截</text>
    <text x="700" y="756" class="small muted">只看不改；切回「布置」再编辑。</text>
  </g>
