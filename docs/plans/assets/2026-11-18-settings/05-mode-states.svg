<svg width="1600" height="1040" viewBox="0 0 1600 1040" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">快捷键模式状态与失效原因草图</title>
  <desc id="desc">五种画布模式的可用键、被拦键与反馈矩阵：布置可编辑，户外模式先行，标注工具接管，漫游相机接管，评审/执行只读；拦截必须说明原因。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1F2933" flood-opacity="0.08"/>
    </filter>
    <style>
      .ink { fill: #1F2933; }
      .muted { fill: #6B7280; }
      .faint { fill: #9CA3AF; }
      .teal { fill: #0F766E; }
      .orange { fill: #B45309; }
      .purple { fill: #6D28D9; }
      .blue { fill: #1D4ED8; }
      .gray { fill: #4B5563; }
      .red { fill: #B42318; }
      .label { font: 600 13px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; letter-spacing: .04em; }
      .h1 { font: 700 34px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
      .h2 { font: 700 20px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
      .h3 { font: 700 17px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
      .body { font: 400 13px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
      .small { font: 400 12px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
      .tiny { font: 400 11px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
      .strong { font: 600 13px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
      .kbd { font: 600 11px "Cascadia Mono", "SFMono-Regular", Consolas, monospace; }
      .strike { text-decoration: line-through; }
      .code { font: 400 10px "Cascadia Mono", "SFMono-Regular", Consolas, monospace; fill: #9CA3AF; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#F7F5EF"/>
  <text x="1552" y="50" class="tiny muted" text-anchor="end">讨论稿 · 2026-11-18</text>
  <text x="48" y="60" class="h1 ink">快捷键模式状态与失效原因</text>
  <text x="48" y="92" class="body muted">快捷键不是一张静态表：同一个键在五种画布模式下有不同归属。失效时要说原因，执行时不要弹提示。</text>

  <rect x="48" y="116" width="1504" height="42" rx="10" fill="#FFFDF8" stroke="#E5E1D8"/>
  <text x="68" y="142" class="small muted">参考：VS Code 只读编辑器在顶部说明原因 · Blender 左上角模式头 · Linear 命令菜单的空状态与上下文提示</text>
  <text x="1512" y="142" class="tiny faint" text-anchor="end">不照搬：冲突检测 / 自定义改键</text>

  <!-- Five cards -->
  <!-- Build -->
  <g filter="url(#shadow)">
    <rect x="48" y="180" width="292" height="420" rx="14" fill="#FFFFFF" stroke="#E5E1D8"/>
  </g>
  <rect x="48" y="180" width="292" height="6" rx="3" fill="#0F766E"/>
  <text x="68" y="212" class="h3 ink">布置</text>
  <rect x="232" y="194" width="88" height="24" rx="12" fill="#E6F4F1" stroke="#9CCFC5"/>
  <text x="276" y="210" text-anchor="middle" class="tiny teal">可编辑</text>
  <text x="68" y="238" class="small muted">裸键直接编辑；G 只切网格。</text>
  <text x="68" y="270" class="tiny teal">可用</text>
  <g transform="translate(68 282)">
    <rect x="0" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="17" y="19" text-anchor="middle" class="kbd">Q</text>
    <rect x="40" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="57" y="19" text-anchor="middle" class="kbd">E</text>
    <rect x="80" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="97" y="19" text-anchor="middle" class="kbd">R</text>
    <rect x="120" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="137" y="19" text-anchor="middle" class="kbd">S</text>
    <rect x="160" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="177" y="19" text-anchor="middle" class="kbd">F</text>
    <rect x="0" y="36" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="17" y="55" text-anchor="middle" class="kbd">G</text>
    <rect x="40" y="36" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="57" y="55" text-anchor="middle" class="kbd">M</text>
    <rect x="80" y="36" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="97" y="55" text-anchor="middle" class="kbd">P</text>
    <rect x="120" y="36" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="137" y="55" text-anchor="middle" class="kbd">2</text>
    <rect x="160" y="36" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="177" y="55" text-anchor="middle" class="kbd">Del</text>
  </g>
  <text x="68" y="374" class="tiny faint">被拦</text>
  <text x="68" y="394" class="small muted">无；拖拽中编辑键暂扣。</text>
  <line x1="68" y1="416" x2="320" y2="416" stroke="#ECE8DF"/>
  <text x="68" y="442" class="tiny teal">反馈</text>
  <text x="68" y="462" class="small muted">执行不提示；拖拽/锁定时说明。</text>
  <text x="68" y="486" class="tiny faint">入口：键盘 ? · 布置</text>
  <line x1="68" y1="508" x2="320" y2="508" stroke="#F1EDE5"/>
  <text x="68" y="528" class="code">workbenchMode === layout</text>
  <text x="68" y="544" class="tiny faint">状态来源：建造画布</text>

  <!-- Outdoor -->
  <g filter="url(#shadow)">
    <rect x="358" y="180" width="292" height="420" rx="14" fill="#FFFFFF" stroke="#E5E1D8"/>
  </g>
  <rect x="358" y="180" width="292" height="6" rx="3" fill="#B45309"/>
  <text x="378" y="212" class="h3 ink">户外</text>
  <rect x="542" y="194" width="88" height="24" rx="12" fill="#FFF3E8" stroke="#F0C7A6"/>
  <text x="586" y="210" text-anchor="middle" class="tiny orange">模式先行</text>
  <text x="378" y="238" class="small muted">裸单键先给模式，再轮到工具。</text>
  <text x="378" y="270" class="tiny orange">可用</text>
  <g transform="translate(378 282)">
    <rect x="0" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="17" y="19" text-anchor="middle" class="kbd">H</text>
    <rect x="40" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="57" y="19" text-anchor="middle" class="kbd">S</text>
    <rect x="80" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="97" y="19" text-anchor="middle" class="kbd">T</text>
    <rect x="120" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="137" y="19" text-anchor="middle" class="kbd">R</text>
    <rect x="160" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="177" y="19" text-anchor="middle" class="kbd">O</text>
    <rect x="0" y="36" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="17" y="55" text-anchor="middle" class="kbd">Y</text>
    <rect x="40" y="36" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="57" y="55" text-anchor="middle" class="kbd">L</text>
    <rect x="80" y="36" width="42" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="101" y="55" text-anchor="middle" class="kbd">Esc</text>
  </g>
  <text x="378" y="374" class="tiny faint">同名提醒</text>
  <text x="378" y="394" class="small muted">S 在建造是缩放；R 设施落位时让给旋转。</text>
  <line x1="378" y1="416" x2="630" y2="416" stroke="#ECE8DF"/>
  <text x="378" y="442" class="tiny orange">反馈</text>
  <text x="378" y="462" class="small muted">同名键用「模式」解释，不叫冲突。</text>
  <text x="378" y="486" class="tiny faint">入口：键盘 ? · 户外</text>
  <line x1="378" y1="508" x2="630" y2="508" stroke="#F1EDE5"/>
  <text x="378" y="528" class="code">outdoor2DOpen || takeover</text>
  <text x="378" y="544" class="tiny faint">状态来源：户外地图 / 场地接管</text>

  <!-- Annotate -->
  <g filter="url(#shadow)">
    <rect x="668" y="180" width="292" height="420" rx="14" fill="#FFFFFF" stroke="#E5E1D8"/>
  </g>
  <rect x="668" y="180" width="292" height="6" rx="3" fill="#6D28D9"/>
  <text x="688" y="212" class="h3 ink">标注</text>
  <rect x="852" y="194" width="88" height="24" rx="12" fill="#F3E8FF" stroke="#D8B4FE"/>
  <text x="896" y="210" text-anchor="middle" class="tiny purple">工具接管</text>
  <text x="688" y="238" class="small muted">进入标注后，T/R/O/Y/L 先给工具。</text>
  <text x="688" y="270" class="tiny purple">可用</text>
  <g transform="translate(688 282)">
    <rect x="0" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="17" y="19" text-anchor="middle" class="kbd">T</text>
    <rect x="40" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="57" y="19" text-anchor="middle" class="kbd">R</text>
    <rect x="80" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="97" y="19" text-anchor="middle" class="kbd">O</text>
    <rect x="120" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="137" y="19" text-anchor="middle" class="kbd">Y</text>
    <rect x="160" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="177" y="19" text-anchor="middle" class="kbd">L</text>
    <rect x="0" y="36" width="42" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="21" y="55" text-anchor="middle" class="kbd">Esc</text>
  </g>
  <text x="688" y="374" class="tiny faint">被拦</text>
  <text x="688" y="394" class="small muted">输入框内不拦截；设施落位时 R 让开。</text>
  <line x1="688" y1="416" x2="940" y2="416" stroke="#ECE8DF"/>
  <text x="688" y="442" class="tiny purple">反馈</text>
  <text x="688" y="462" class="small muted">Esc 先取消当前一笔，再退出工具。</text>
  <text x="688" y="486" class="tiny faint">入口：键盘 ? · 标注</text>
  <line x1="688" y1="508" x2="940" y2="508" stroke="#F1EDE5"/>
  <text x="688" y="528" class="code">planAnnot.drawMode !== off</text>
  <text x="688" y="544" class="tiny faint">状态来源：标注绘图</text>

  <!-- Walk -->
  <g filter="url(#shadow)">
    <rect x="978" y="180" width="292" height="420" rx="14" fill="#FFFFFF" stroke="#E5E1D8"/>
  </g>
  <rect x="978" y="180" width="292" height="6" rx="3" fill="#1D4ED8"/>
  <text x="998" y="212" class="h3 ink">漫游</text>
  <rect x="1182" y="194" width="68" height="24" rx="12" fill="#E8EEFF" stroke="#B8C6F4"/>
  <text x="1216" y="210" text-anchor="middle" class="tiny blue">相机接管</text>
  <text x="998" y="238" class="small muted">WASD / 方向键归相机，裸单键关闭。</text>
  <text x="998" y="270" class="tiny blue">可用</text>
  <g transform="translate(998 282)">
    <rect x="0" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="17" y="19" text-anchor="middle" class="kbd">W</text>
    <rect x="40" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="57" y="19" text-anchor="middle" class="kbd">A</text>
    <rect x="80" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="97" y="19" text-anchor="middle" class="kbd">S</text>
    <rect x="120" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="137" y="19" text-anchor="middle" class="kbd">D</text>
    <rect x="160" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="177" y="19" text-anchor="middle" class="kbd">F</text>
    <rect x="0" y="36" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="17" y="55" text-anchor="middle" class="kbd">E</text>
    <rect x="40" y="36" width="42" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="61" y="55" text-anchor="middle" class="kbd">Esc</text>
    <rect x="88" y="36" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="105" y="55" text-anchor="middle" class="kbd">F5</text>
  </g>
  <text x="998" y="374" class="tiny red">被拦</text>
  <g transform="translate(998 386)">
    <rect x="0" y="0" width="54" height="28" rx="5" fill="#FBEAEA" stroke="#E4B4B0"/><text x="27" y="19" text-anchor="middle" class="kbd red strike">Del</text>
    <rect x="60" y="0" width="34" height="28" rx="5" fill="#FBEAEA" stroke="#E4B4B0"/><text x="77" y="19" text-anchor="middle" class="kbd red strike">R</text>
    <rect x="100" y="0" width="54" height="28" rx="5" fill="#FBEAEA" stroke="#E4B4B0"/><text x="127" y="19" text-anchor="middle" class="kbd red strike">⌘D</text>
  </g>
  <text x="998" y="440" class="tiny blue">仍可用</text>
  <text x="998" y="460" class="small muted">撤销 / 重做 / Esc；按 Esc 退出漫游。</text>
  <text x="998" y="486" class="tiny faint">入口：键盘 ? · 漫游</text>
  <line x1="998" y1="508" x2="1250" y2="508" stroke="#F1EDE5"/>
  <text x="998" y="528" class="code">walkthroughActive</text>
  <text x="998" y="544" class="tiny faint">状态来源：一人称漫游</text>

  <!-- Review -->
  <g filter="url(#shadow)">
    <rect x="1288" y="180" width="264" height="420" rx="14" fill="#FFFFFF" stroke="#E5E1D8"/>
  </g>
  <rect x="1288" y="180" width="264" height="6" rx="3" fill="#4B5563"/>
  <text x="1308" y="212" class="h3 ink">评审 / 执行</text>
  <rect x="1452" y="194" width="68" height="24" rx="12" fill="#F3F4F1" stroke="#D1D5DB"/>
  <text x="1486" y="210" text-anchor="middle" class="tiny gray">只读</text>
  <text x="1308" y="238" class="small muted">撤销 / 删除 / 旋转 / 微移 / 粘贴被拦。</text>
  <text x="1308" y="270" class="tiny gray">可用</text>
  <g transform="translate(1308 282)">
    <rect x="0" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="17" y="19" text-anchor="middle" class="kbd">M</text>
    <rect x="40" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="57" y="19" text-anchor="middle" class="kbd">G</text>
    <rect x="80" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="97" y="19" text-anchor="middle" class="kbd">P</text>
    <rect x="120" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="137" y="19" text-anchor="middle" class="kbd">[</text>
    <rect x="160" y="0" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="177" y="19" text-anchor="middle" class="kbd">]</text>
    <rect x="0" y="36" width="34" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="17" y="55" text-anchor="middle" class="kbd">2</text>
    <rect x="40" y="36" width="54" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="67" y="55" text-anchor="middle" class="kbd">PgUp</text>
    <rect x="100" y="36" width="54" height="28" rx="5" fill="#FFFFFF" stroke="#D8D4CA"/><text x="127" y="55" text-anchor="middle" class="kbd">PgDn</text>
  </g>
  <text x="1308" y="374" class="tiny red">被拦</text>
  <g transform="translate(1308 386)">
    <rect x="0" y="0" width="54" height="28" rx="5" fill="#FBEAEA" stroke="#E4B4B0"/><text x="27" y="19" text-anchor="middle" class="kbd red strike">Del</text>
    <rect x="60" y="0" width="34" height="28" rx="5" fill="#FBEAEA" stroke="#E4B4B0"/><text x="77" y="19" text-anchor="middle" class="kbd red strike">R</text>
    <rect x="100" y="0" width="54" height="28" rx="5" fill="#FBEAEA" stroke="#E4B4B0"/><text x="127" y="19" text-anchor="middle" class="kbd red strike">⌘Z</text>
    <rect x="160" y="0" width="34" height="28" rx="5" fill="#FBEAEA" stroke="#E4B4B0"/><text x="177" y="19" text-anchor="middle" class="kbd red strike">↑</text>
  </g>
