<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aholo 3DGS 场景漫游 · 实验</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d10; color: #e8ecf1; font: 14px/1.5 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; overflow: hidden; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #topbar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; z-index: 3; }
    #topbar .title { font-weight: 600; letter-spacing: .02em; margin-right: 6px; opacity: .9; }
    .chip { background: rgba(20, 24, 30, .82); border: 1px solid rgba(255,255,255,.14); color: inherit; border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; }
    .chip:hover { border-color: rgba(120, 190, 255, .7); }
    .chip.on { background: rgba(58, 130, 210, .35); border-color: rgba(120, 190, 255, .85); }
    #hud { position: fixed; left: 12px; bottom: 12px; z-index: 3; font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; color: #b9c4d0; background: rgba(12, 15, 19, .72); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 8px 12px; white-space: pre; pointer-events: none; }
    #overlay { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(10,13,17,.35), rgba(8,10,13,.88)); cursor: pointer; transition: opacity .25s; }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #overlay .card { text-align: center; max-width: 520px; padding: 26px 30px; border: 1px solid rgba(255,255,255,.12); border-radius: 16px; background: rgba(14,18,23,.86); }
    #overlay h1 { margin: 0 0 6px; font-size: 20px; }
    #overlay p { margin: 6px 0; color: #a9b4c1; }
    #overlay kbd { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 5px; padding: 1px 6px; font: 12px ui-monospace, monospace; }
    #status { position: fixed; right: 12px; bottom: 12px; z-index: 3; font-size: 12px; color: #8fa1b3; text-align: right; }
    #status.error { color: #ff8f8f; }
    .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 12px; }
    .bar > i { display: block; height: 100%; width: 0; background: #4f9cf0; transition: width .15s; }
  </style>
  <!-- 只做实验页：three 与 spark 直接从仓库 node_modules 以 ESM 引入，不产生构建产物。 -->
  <script type="importmap">
    {
      "imports": {
        "three": "../../../frontend/node_modules/three/build/three.module.js",
        "three/addons/": "../../../frontend/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="topbar">
    <span class="title">Aholo World · 3DGS 场景漫游（实验页）</span>
    <span id="scene-buttons"></span>
    <button id="lock-toggle" type="button" class="chip">锁定鼠标（FPS）</button>
    <button id="roam-exit" type="button" class="chip">退出漫游</button>
  </div>

  <div id="hud">加载中…</div>
  <div id="status"></div>

  <div id="overlay">
    <div class="card">
      <h1>进入 Aholo 场景漫游</h1>
      <p>点画面开始：默认不锁鼠标，按住左键拖动转头，光标一直在。</p>
      <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 · 左键拖动 转向 · <kbd>Shift</kbd> 加速 · <kbd>Esc</kbd> 退出</p>
      <div class="bar"><i id="progress"></i></div>
    </div>
  </div>

  <script type="module" src="./walkthrough.mjs"></script>
</body>
</html>
